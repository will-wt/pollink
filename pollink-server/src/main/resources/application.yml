server:
  port: 8080

nova:
  pollink:
    server:
      # gRPC 服务端端口，所有节点统一
      grpc-port: 9101
      # 长轮询 hold 超时时间（秒）
      poll-timeout-seconds: 30
      # 节点 IP，留空则自动检测（Docker/K8s 环境下建议显式配置）
      node-ip:
    discovery:
      type: mysql
      heartbeat-interval-seconds: 5
      node-timeout-seconds: 15

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nova_long_polling?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
